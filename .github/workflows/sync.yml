name: sync-images

on:
  push:
    branches: [main]
    paths:
      - images.yaml
      - scripts/sync.sh
      - .github/workflows/sync.yml
  schedule:
    - cron: "0 18 * * *"   # 北京时间每天 02:00
  workflow_dispatch:

concurrency:
  group: sync-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
    steps:
      - uses: actions/checkout@v5

      # 变量为空时 login-action 会默认登录 docker.io，导致误导性的报错，这里提前拦截
      - name: Preflight
        env:
          HAS_ACR_USER: ${{ secrets.ACR_USERNAME != '' }}
          HAS_ACR_PASS: ${{ secrets.ACR_PASSWORD != '' }}
          HAS_HUB_USER: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          missing=()
          [[ -n "$ACR_REGISTRY" ]]       || missing+=("Variable ACR_REGISTRY")
          [[ -n "$ACR_NAMESPACE" ]]      || missing+=("Variable ACR_NAMESPACE")
          [[ "$HAS_ACR_USER" == true ]]  || missing+=("Secret ACR_USERNAME")
          [[ "$HAS_ACR_PASS" == true ]]  || missing+=("Secret ACR_PASSWORD")
          [[ "$HAS_HUB_USER" == true ]]  || missing+=("Secret DOCKERHUB_USERNAME")
          [[ "$HAS_HUB_TOKEN" == true ]] || missing+=("Secret DOCKERHUB_TOKEN")
          if (( ${#missing[@]} )); then
            for m in "${missing[@]}"; do echo "::error::缺少 $m（Settings → Secrets and variables → Actions）"; done
            exit 1
          fi
          echo "ACR_REGISTRY=$ACR_REGISTRY ACR_NAMESPACE=$ACR_NAMESPACE"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tool versions
        run: |
          skopeo --version
          yq --version
          jq --version
          docker buildx version

      - name: Sync
        run: bash scripts/sync.sh